name: SV_LAND_PARTICIPATION_INTERESTS
description: Participation and Interests domain covering who owns what percentage in each agreement, ConocoPhillips working interests by property/well, well associations, business associate details (names and addresses), participation interest types, and JVA ownership. Supports queries about partner interests, working interest analysis, well-to-agreement linkages, and business associate lookups.
tables:
  - name: QUORUM_QLREPORT_COP_RPA_DSM_PLSE_JVA
    description: Joint Venture Agreement (JVA) ownership table. Contains ConocoPhillips JVA partner ownership details by property including owner names, ownership types (Working, Royalty), oil and gas gross revenue interest (GRI) percentages, and field/property identifiers. Use this table to answer questions about who owns what percentage of revenue interest in a property under a JVA, or to look up partner-level GRI allocations.
    base_table:
      database: L48_PRD
      schema: L48_LAND
      table: QUORUM_QLREPORT_COP_RPA_DSM_PLSE_JVA
    dimensions:
      - name: ACTIVE_FLAG
        synonyms:
          - active flag
          - JVA active
        description: Active flag for the JVA record
        expr: ACTIVE_FLAG
        data_type: VARCHAR(1)
        access_modifier: public_access
      - name: ACTIVE_IND
        synonyms:
          - active indicator
          - is active
        description: Active indicator flag (Y=Active, N=Inactive)
        expr: ACTIVE_IND
        data_type: VARCHAR(1)
        access_modifier: public_access
      - name: FIELD_CODE
        synonyms:
          - field code
          - field id
        description: Field code identifier for the JVA
        expr: FIELD_CODE
        data_type: VARCHAR(10)
        access_modifier: public_access
      - name: FIELD_DESC
        synonyms:
          - field
          - field description
          - field name
        description: Field description/name for the JVA
        expr: FIELD_DESC
        data_type: VARCHAR(30)
        access_modifier: public_access
      - name: OWNER_NAME
        synonyms:
          - JVA owner
          - owner name
          - partner name
        description: Owner/partner name in the JVA
        expr: OWNER_NAME
        data_type: VARCHAR(40)
        access_modifier: public_access
      - name: OWNER_NUMBER
        synonyms:
          - owner id
          - owner number
          - partner number
        description: Owner number identifier in the JVA
        expr: OWNER_NUMBER
        data_type: VARCHAR(10)
        access_modifier: public_access
      - name: OWNERSHIP_TYPE
        synonyms:
          - interest ownership type
          - JVA ownership type
          - ownership type
        description: Ownership type classification in the JVA (e.g., Working, Royalty)
        expr: OWNERSHIP_TYPE
        data_type: VARCHAR(3)
        access_modifier: public_access
      - name: PROPERTY_NAME
        synonyms:
          - property
          - property name
        description: Property name for the JVA record
        expr: PROPERTY_NAME
        data_type: VARCHAR(40)
        access_modifier: public_access
      - name: PROPERTY_NUMBER
        synonyms:
          - prop number
          - property id
          - property number
        description: Property number identifier for the JVA record
        expr: PROPERTY_NUMBER
        data_type: VARCHAR(12)
        access_modifier: public_access
    facts:
      - name: GAS_GRI
        synonyms:
          - gas GRI
          - gas gross revenue interest
          - gas revenue interest
        description: Gas gross revenue interest percentage for the owner
        expr: GAS_GRI
        data_type: NUMBER(28,8)
        access_modifier: public_access
      - name: OIL_GRI
        synonyms:
          - oil GRI
          - oil gross revenue interest
          - oil revenue interest
        description: Oil gross revenue interest percentage for the owner
        expr: OIL_GRI
        data_type: NUMBER(28,8)
        access_modifier: public_access
    metrics:
      - name: AVG_GAS_GRI
        description: Average gas gross revenue interest (GRI) for active JVA records only (ACTIVE_IND = Y). Use this metric when asked about average gas revenue interest across properties or partners.
        expr: AVG(CASE WHEN ACTIVE_IND ILIKE 'Y' THEN GAS_GRI ELSE NULL END)
        access_modifier: public_access
      - name: AVG_OIL_GRI
        description: Average oil gross revenue interest (GRI) for active JVA records only (ACTIVE_IND = Y). Use this metric when asked about average oil revenue interest across properties or partners.
        expr: AVG(CASE WHEN ACTIVE_IND ILIKE 'Y' THEN OIL_GRI ELSE NULL END)
        access_modifier: public_access
  - name: QUORUM_QLREPORT_PIP_TYPES
    description: Reference/lookup table for participation interest type codes. Maps PIP_TYPE_CODE (WI, ORRI, RI, NRI) to their full descriptions and category groupings. Use this table to decode interest type codes into human-readable names. Primary key is PIP_TYPE_CODE.
    base_table:
      database: L48_PRD
      schema: L48_LAND
      table: QUORUM_QLREPORT_PIP_TYPES
    dimensions:
      - name: ACTIVE_IND
        synonyms:
          - active flag
          - is active
        description: Active indicator flag (Y=Active, N=Inactive)
        expr: ACTIVE_IND
        data_type: VARCHAR(1)
        access_modifier: public_access
      - name: PIP_TYPE_CATG
        synonyms:
          - interest category code
          - PIP category code
        description: Participation interest type category grouping code
        expr: PIP_TYPE_CATG
        data_type: VARCHAR(3)
        access_modifier: public_access
      - name: PIP_TYPE_CODE
