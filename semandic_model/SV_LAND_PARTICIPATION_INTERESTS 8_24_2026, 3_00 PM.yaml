        data_type: VARCHAR(50)
        access_modifier: public_access
    primary_key:
      columns:
        - PIP_TYPE_CODE
  - name: QUORUM_QLREPORT_PIP_TYPE_CATG
    description: Reference/lookup table for participation interest type categories. Provides the higher-level groupings (Revenue, Cost, Ownership) that organize individual PIP types. Joins to PIP_TYPES via PIP_TYPE_CATG. Use this table to aggregate or filter interests by broad category.
    base_table:
      database: L48_PRD
      schema: L48_LAND
      table: QUORUM_QLREPORT_PIP_TYPE_CATG
    dimensions:
      - name: ACTIVE_IND
        synonyms:
          - active flag
          - is active
        description: Active indicator flag (Y=Active, N=Inactive)
        expr: ACTIVE_IND
        data_type: VARCHAR(1)
        access_modifier: public_access
      - name: PIP_TYPE_CATG
        synonyms:
          - category code
          - interest category code
          - PIP category
        description: Participation interest type category code
        expr: PIP_TYPE_CATG
        data_type: VARCHAR(3)
        access_modifier: public_access
      - name: PIP_TYPE_CATG_DESC
        synonyms:
          - category description
          - interest category
          - PIP category description
        description: Participation interest type category description (e.g., Revenue, Cost, Ownership)
        expr: PIP_TYPE_CATG_DESC
        data_type: VARCHAR(50)
        access_modifier: public_access
    primary_key:
      columns:
        - PIP_TYPE_CATG
