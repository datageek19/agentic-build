  - name: QUORUM_QLREPORT_QDV_RELATED_WELL_AGMT
    description: Well-to-agreement association table. Links wells to their parent agreements providing well details including API number, well name/number, production status, operator, geological formations (top/base), basin, county/state, and DOE field. Use this table to find which wells are under a specific agreement or to look up well attributes. Joins to AGMT_HDR via ARRG_KEY.
    base_table:
      database: L48_PRD
      schema: L48_LAND
      table: QUORUM_QLREPORT_QDV_RELATED_WELL_AGMT
    dimensions:
      - name: ACTIVE_IND
        synonyms:
          - active flag
          - is active
        description: Active indicator flag (Y=Active, N=Inactive)
        expr: ACTIVE_IND
        data_type: VARCHAR(1)
        access_modifier: public_access
      - name: AGMT_NUM
        synonyms:
          - agreement number
          - contract number
        description: Agreement number associated with the well
        expr: AGMT_NUM
        data_type: VARCHAR(12)
        access_modifier: public_access
      - name: API_NUMBER
        synonyms:
          - API number
          - API well number
        description: API (American Petroleum Institute) well number
        expr: API_NUMBER
        data_type: VARCHAR(250)
        access_modifier: public_access
      - name: API10
        synonyms:
          - API
        description: API well number (first 10 digits of API_NUMBER, standard API10 format)
        expr: LEFT(API_NUMBER, 10)
        data_type: VARCHAR(250)
        access_modifier: public_access
      - name: ARRG_KEY
        synonyms:
          - agreement key
          - arrangement key
        description: Arrangement key linking well to agreement
        expr: ARRG_KEY
        data_type: NUMBER(22,0)
        access_modifier: public_access
      - name: BASE_FORMATION
        synonyms:
