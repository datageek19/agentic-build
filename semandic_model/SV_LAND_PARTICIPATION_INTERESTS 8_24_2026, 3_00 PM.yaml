  - name: QUORUM_QLREPORT_QDV_COP_WI
    description: ConocoPhillips working interest table by property. Contains COP-specific interest percentages including Working Interest (WI), Before Payout (BPO), After Payout (APO), Carried Interest, and Net Cost/Sales Interest (NCI/NSI). Also includes organizational context such as business unit, asset area, prospect, contract area, and property status. Use this table for COP ownership percentages or organizational allocation of working interests. Joins to AGMT_HDR via CONTRACT_ARRG_KEY.
    base_table:
      database: L48_PRD
      schema: L48_LAND
      table: QUORUM_QLREPORT_QDV_COP_WI
    dimensions:
      - name: ACTIVE_IND
        synonyms:
          - active flag
          - is active
        description: Active indicator flag (Y=Active, N=Inactive)
        expr: ACTIVE_IND
        data_type: VARCHAR(1)
        access_modifier: public_access
      - name: ASSET_AREA_CODE
        synonyms:
          - asset area id
          - asset code
        description: Asset area identification code
        expr: ASSET_AREA_CODE
        data_type: VARCHAR(20)
        access_modifier: public_access
      - name: ASSET_AREA_DESCRIPTION
        synonyms:
          - asset area
          - asset area name
        description: Asset area name/description
        expr: ASSET_AREA_DESCRIPTION
        data_type: VARCHAR(300)
        access_modifier: public_access
      - name: BUSINESS_UNIT_CODE
        synonyms:
          - BU code
          - business unit id
        description: Business unit code managing the property
        expr: BUSINESS_UNIT_CODE
        data_type: VARCHAR(20)
        access_modifier: public_access
      - name: BUSINESS_UNIT_DESCRIPTION
        synonyms:
          - BU name
          - business unit
          - business unit name
        description: Business unit name/description
        expr: BUSINESS_UNIT_DESCRIPTION
        data_type: VARCHAR(300)
        access_modifier: public_access
      - name: CONTRACT_ARE_NAME
        synonyms:
          - area name
          - contract area
          - contract area name
        description: Contract area name identifying the geographic/business area
        expr: CONTRACT_ARE_NAME
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: CONTRACT_ARRG_KEY
        synonyms:
          - contract agreement key
          - contract arrangement key
        description: Contract arrangement key linking COP working interest to agreement
        expr: CONTRACT_ARRG_KEY
        data_type: NUMBER(10,0)
        access_modifier: public_access
      - name: CONTRACT_NUMBER
        synonyms:
          - contract id
          - contract number
        description: Contract number for the COP working interest record
        expr: CONTRACT_NUMBER
        data_type: VARCHAR(12)
        access_modifier: public_access
      - name: COPAS_YEAR
        synonyms:
          - accounting standard year
          - COPAS year
        description: COPAS (Council of Petroleum Accountants Societies) accounting year version
        expr: COPAS_YEAR
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: PROP_STATUS
        synonyms:
          - property status
          - status
        description: Property status (e.g., Active, Inactive, Suspense)
        expr: PROP_STATUS
        data_type: VARCHAR(3)
        access_modifier: public_access
      - name: PROPERTY_NAME
        synonyms:
          - property
          - property name
        description: Property name for the working interest
        expr: PROPERTY_NAME
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: PROPERTY_NUM
        synonyms:
          - prop number
          - property id
          - property number
        description: Property number identifier for the working interest
        expr: PROPERTY_NUM
        data_type: VARCHAR(12)
        access_modifier: public_access
      - name: PROSPECT_CODE
        synonyms:
          - prospect id
          - prospect identifier
        description: Prospect area identification code
        expr: PROSPECT_CODE
        data_type: VARCHAR(20)
        access_modifier: public_access
      - name: PROSPECT_DESCRIPTION
        synonyms:
          - prospect
          - prospect name
        description: Prospect area name/description
        expr: PROSPECT_DESCRIPTION
        data_type: VARCHAR(300)
        access_modifier: public_access
      - name: ST_PSTL_ABBR
        synonyms:
          - state
          - state abbreviation
        description: Two-letter state postal abbreviation for the property
        expr: ST_PSTL_ABBR
        data_type: VARCHAR(10)
        access_modifier: public_access
    facts:
      - name: APO
        synonyms:
          - after payout
          - after payout interest
          - APO interest
        description: After payout interest percentage
        expr: APO
        data_type: NUMBER(28,6)
        access_modifier: public_access
      - name: BPO
        synonyms:
          - before payout
          - before payout interest
          - BPO interest
        description: Before payout interest percentage
        expr: BPO
        data_type: NUMBER(28,6)
        access_modifier: public_access
      - name: CARRIED_INT
        synonyms:
          - carried interest
          - carried interest percent
        description: Carried interest percentage where costs are borne by another party
        expr: CARRIED_INT
        data_type: NUMBER(28,6)
        access_modifier: public_access
      - name: COP_NCI_NSI
        synonyms:
          - COP NCI NSI
          - net cost interest
          - net sales interest
        description: ConocoPhillips Net Cost Interest / Net Sales Interest
        expr: COP_NCI_NSI
        data_type: NUMBER(28,6)
        access_modifier: public_access
      - name: WI
        synonyms:
          - COP working interest
          - WI percent
          - working interest
        description: Working interest percentage for ConocoPhillips
        expr: WI
        data_type: NUMBER(28,6)
        access_modifier: public_access
    metrics:
      - name: AVG_APO_INTEREST
        description: Average after payout (APO) interest for active records. Use when asked about average APO or after payout interest percentages.
        expr: AVG(CASE WHEN ACTIVE_IND ILIKE 'Y' AND APO > 0 THEN APO END)
        access_modifier: public_access
      - name: AVG_BPO_INTEREST
        description: Average before payout (BPO) interest for active records. Use when asked about average BPO or before payout interest percentages.
        expr: AVG(CASE WHEN ACTIVE_IND ILIKE 'Y' AND BPO > 0 THEN BPO END)
        access_modifier: public_access
      - name: AVG_COP_NCI_NSI
        description: Average ConocoPhillips Net Cost Interest / Net Sales Interest for active records only (ACTIVE_IND = Y). Use this metric when asked about average net cost or net sales interest.
        expr: AVG(CASE WHEN ACTIVE_IND ILIKE 'Y' THEN COP_NCI_NSI ELSE NULL END)
        access_modifier: public_access
      - name: AVG_COP_WORKING_INTEREST
        description: Average ConocoPhillips working interest (WI) percentage for active records only (ACTIVE_IND = Y). Use this metric when asked about average COP working interest across properties or agreements.
        expr: AVG(CASE WHEN ACTIVE_IND ILIKE 'Y' THEN WI ELSE NULL END)
        access_modifier: public_access
  - name: QUORUM_QLREPORT_QDV_PARTICIPATION
    description: Detailed participation interest records showing who owns what percentage in each agreement. Each row represents a specific interest type (WI, ORRI, RI) held by a specific participant in a specific agreement/subdivision. Key attributes include interest percentage (PCT_INT), operator flag, COP share inclusion flag, and participant details. Primary key is DESG_KEY. This is the core table for partner ownership breakdown by agreement.
    base_table:
      database: L48_PRD
      schema: L48_LAND
      table: QUORUM_QLREPORT_QDV_PARTICIPATION
    dimensions:
      - name: ACTIVE_IND
        synonyms:
          - active flag
          - is active
        description: Active indicator flag (Y=Active, N=Inactive)
        expr: ACTIVE_IND
        data_type: VARCHAR(1)
        access_modifier: public_access
      - name: AGMT_NUM
        synonyms:
          - agreement number
          - contract number
        description: Agreement number for the participation record
        expr: AGMT_NUM
        data_type: VARCHAR(12)
        access_modifier: public_access
      - name: ARRG_DSCR
        synonyms:
          - agreement description
          - arrangement description
        description: Arrangement description text for the participation
        expr: ARRG_DSCR
        data_type: VARCHAR(3)
        access_modifier: public_access
