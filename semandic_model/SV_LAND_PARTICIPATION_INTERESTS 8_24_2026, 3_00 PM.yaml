        expr: BASE_FORMATION
        data_type: VARCHAR(250)
        access_modifier: public_access
      - name: BASIN
        synonyms:
          - basin
          - geological basin
          - well basin
        description: Basin name where the well is located
        expr: BASIN
        data_type: VARCHAR(250)
        access_modifier: public_access
      - name: COUNTY
        synonyms:
          - county
          - well county
        description: County where the well is located
