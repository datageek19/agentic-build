verified_queries:
  - name: OPERATING_AGREEMENTS_FOR_PROPERTY_NUMBERS
    sql: SELECT DISTINCT h.AGMT_NUM AS operating_agreement_number, h.AGMT_NAME AS operating_agreement_name, h.ARRG_TYPE_DESC AS arrg_type_desc, w.PROPERTY_NUM AS property_number, w.PROPERTY_NAME AS property_name FROM L48_PRD.L48_LAND.QUORUM_QLREPORT_QDV_COP_WI AS w JOIN L48_PRD.L48_LAND.QUORUM_QLREPORT_QDV_AGMT_HDR AS h ON w.CONTRACT_ARRG_KEY = h.ARRG_KEY WHERE w.ACTIVE_IND ILIKE 'Y' AND h.ACTIVE_IND ILIKE 'Y' AND w.PROPERTY_NUM IN ('A776589', 'A775008', 'A773771', 'A773774', 'A774304', 'A774234', 'A774804', 'A773944', 'A774544', 'A774058', 'A774661', 'A774746', 'A774119', 'A774390', 'A774512', 'A774486', 'A776834', 'A776855', 'A774842', 'A776754', 'A773813', 'A774251', 'A774358', 'A774179', 'A773800', 'A774754', 'A774970', 'A774064', 'A775984', 'A767848', 'A767093', 'A767823', 'A780799', 'A778332', 'A778333', 'A774395', 'A774671', 'A773983', 'A758397') AND (h.ARRG_TYPE_DESC ILIKE '%OPERATING AGREEMENT%' OR h.ARRG_TYPE_DESC ILIKE '%JOINT OPERATING AGREEMENT%' OR h.SUBJ_DESC ILIKE '%OPERATING AGREEMENT%' OR h.SUBJ_DESC ILIKE '%JOINT OPERATING AGREEMENT%') ORDER BY operating_agreement_number ASC, property_number ASC
    question: 'List Operating Agreements related to the following Property Numbers: A776589, A775008, A773771, A773774, A774304, A774234, A774804, A773944, A774544, A774058, A774661, A774746, A774119, A774390, A774512, A774486, A776834, A776855, A774842, A776754, A773813, A774251, A774358, A774179, A773800, A774754, A774970, A774064, A775984, A767848, A767093, A767823, A780799, A778332, A778333, A774395, A774671, A773983, A758397.'
    verified_at: 1752624000
    verified_by: KUNDAN.B.KUMAR
    use_as_onboarding_question: false
  - name: WELL_DETAILS_WITH_OPERATOR_WORKING_INTEREST
    sql: SELECT w.ARRG_KEY AS agreement_key, w.AGMT_NUM AS agreement_number, w.WELL_KEY AS well_key, w.API_NUMBER AS api_number, w.WELL_NAME AS well_name, w.PRD_STATUS AS production_status, w.OPERATOR AS operator, w.STATE AS state, w.COUNTY AS county, w.BASIN AS basin, w.TOP_FORMATION AS top_formation, w.BASE_FORMATION AS base_formation, c.PROPERTY_NUM AS property_number, c.PROPERTY_NAME AS property_name, c.CONTRACT_NUMBER AS contract_number, c.BUSINESS_UNIT_DESCRIPTION AS business_unit_description, c.ASSET_AREA_DESCRIPTION AS asset_area_description, c.PROSPECT_DESCRIPTION AS prospect_description, c.WI AS operator_working_interest, c.BPO AS bpo, c.APO AS apo FROM L48_PRD.L48_LAND.QUORUM_QLREPORT_QDV_RELATED_WELL_AGMT AS w JOIN L48_PRD.L48_LAND.QUORUM_QLREPORT_QDV_COP_WI AS c ON w.ARRG_KEY = c.CONTRACT_ARRG_KEY WHERE w.ACTIVE_IND ILIKE 'Y' AND c.ACTIVE_IND ILIKE 'Y' ORDER BY w.ARRG_KEY, w.AGMT_NUM, w.WELL_KEY, c.PROPERTY_NUM
    question: What are the well details linked to agreements with their operator working interest from COP_WI?
    verified_at: 1784543345
    verified_by: KUNDAN.B.KUMAR
    use_as_onboarding_question: false
module_custom_instructions:
  sql_generation: |-
    1. Always use ILIKE instead of LIKE for all string comparisons and pattern matching. 2. Always include ACTIVE_IND = 'Y' filter condition on every table referenced in the query to ensure only active records are returned.
    3. When filtering by agreement type or subject description, use ILIKE (e.g., ARRG_TYPE_DESC ILIKE '%Operating Agreement%') rather than UPPER() with LIKE. 4. When joining multiple tables, apply ACTIVE_IND = 'Y' on each table independently.