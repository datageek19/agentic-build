verified_queries:
  - name: PROVISION_CHANGES_COUNT_BY_AGREEMENT_AND_PROVISION_TYPE
    sql: WITH header_dedup AS (SELECT "ARRG_KEY", "ARRG_TYPE_DESC", ROW_NUMBER() OVER (PARTITION BY "ARRG_KEY" ORDER BY CASE WHEN "ACTIVE_IND" = 'Y' THEN 0 ELSE 1 END, COALESCE("ROW_EFFECTIVE_DATE", "ROW_CHANGED_DATE", "ROW_CREATED_DATE") DESC, "ROW_CHANGED_DATE" DESC, "ROW_CREATED_DATE" DESC) AS rn FROM "L48_PRD"."L48_LAND"."QUORUM_QLREPORT_QDV_AGMT_HDR") SELECT h."ARRG_TYPE_DESC" AS agreement_type, p."PROVISION_TYPE" AS provision_type, COUNT(*) AS historical_provision_record_count FROM "L48_PRD"."L48_LAND"."QUORUM_QLREPORT_QDV_PROVISIONS" AS p JOIN header_dedup AS h ON p."ARRG_KEY" = h."ARRG_KEY" AND h.rn = 1 GROUP BY h."ARRG_TYPE_DESC", p."PROVISION_TYPE" ORDER BY historical_provision_record_count DESC, agreement_type, provision_type LIMIT 20
    question: What is the count of provision changes (history) by agreement type and provision type?
    verified_at: 1784542901
    verified_by: KUNDAN.B.KUMAR
    use_as_onboarding_question: false
module_custom_instructions:
  sql_generation: |-
    1. Always use ILIKE instead of LIKE for all string comparisons and pattern matching. 2. Always include ACTIVE_IND = 'Y' filter condition on every table referenced in the query to ensure only active records are returned.
    3. When filtering by obligation type, provision type, or agreement type descriptions, use ILIKE (e.g., STIP_TYPE_DESC ILIKE '%Delay Rental%') rather than exact match or UPPER(). 4. When joining multiple tables, apply ACTIVE_IND = 'Y' on each table independently.