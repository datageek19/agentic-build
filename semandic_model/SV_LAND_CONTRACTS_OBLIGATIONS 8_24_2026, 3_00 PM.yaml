      database: L48_PRD
      schema: L48_LAND
      table: QUORUM_QLREPORT_QDV_PROVISIONS
    dimensions:
      - name: ACTIVE_IND
        synonyms:
          - active flag
          - is active
        description: Active indicator flag (Y=Active, N=Inactive)
        expr: ACTIVE_IND
        data_type: VARCHAR(1)
        access_modifier: public_access
      - name: ADMIN_CATG
        synonyms:
          - admin category
          - administration category
        description: Administrative category for the provision
        expr: ADMIN_CATG
        data_type: VARCHAR(3)
        access_modifier: public_access
      - name: ADMIN_DESC
        synonyms:
          - admin description
          - administration description
        description: Administrative type description for the provision
        expr: ADMIN_DESC
        data_type: VARCHAR(30)
        access_modifier: public_access
      - name: AGMT_NUM
        synonyms:
          - agreement number
          - contract number
        description: Agreement number associated with this provision
        expr: AGMT_NUM
        data_type: VARCHAR(12)
        access_modifier: public_access
      - name: ARRG_DSCR
        synonyms:
          - agreement description
          - arrangement description
        description: Arrangement description text
        expr: ARRG_DSCR
        data_type: VARCHAR(3)
        access_modifier: public_access
      - name: ARRG_KEY
        synonyms:
          - agreement key
          - arrangement key
        description: Arrangement key linking provision to the agreement
        expr: ARRG_KEY
        data_type: NUMBER(10,0)
        access_modifier: public_access
      - name: PROV_RESPONSE
        synonyms:
          - provision response
          - required response
        description: Response action required for the provision
        expr: PROV_RESPONSE
        data_type: VARCHAR(380)
        access_modifier: public_access
      - name: PROVISION_TYPE
        synonyms:
          - clause type
          - provision type
          - stipulation type
        description: Provision type description (e.g., Royalty, Rental, Shut-In, Pugh Clause)
        expr: PROVISION_TYPE
        data_type: VARCHAR(40)
        access_modifier: public_access
      - name: RESP_RESPONSE
        synonyms:
          - response description
        description: Response description for the responsible unit
        expr: RESP_RESPONSE
        data_type: VARCHAR(400)
        access_modifier: public_access
      - name: RESP_UNIT_CD
        synonyms:
          - responsible party code
          - responsible unit code
        description: Responsible unit code indicating who manages this provision
        expr: RESP_UNIT_CD
        data_type: VARCHAR(3)
        access_modifier: public_access
      - name: RESP_VALUE
        synonyms:
          - response value
        description: Response value for the provision
        expr: RESP_VALUE
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: STIP_CATG_CODE
        synonyms:
          - provision category code
          - stipulation category
        description: Stipulation category code for grouping provisions
        expr: STIP_CATG_CODE
        data_type: VARCHAR(3)
        access_modifier: public_access
      - name: STIP_KEY
        synonyms:
          - provision id
          - provision key
          - stipulation key
        description: Unique stipulation/provision record identifier key
        expr: STIP_KEY
        data_type: NUMBER(9,0)
        access_modifier: public_access
      - name: STIP_TYPE_CODE
        synonyms:
          - provision type code
          - stipulation type code
        description: Stipulation/provision type code
        expr: STIP_TYPE_CODE
        data_type: VARCHAR(3)
        access_modifier: public_access
      - name: STIP_UNIT_DESC
        synonyms:
          - provision unit
          - stipulation unit
          - unit description
        description: Unit of measure description for the provision value
        expr: STIP_UNIT_DESC
        data_type: VARCHAR(30)
        access_modifier: public_access
      - name: SUBJECT_TO
        synonyms:
          - contingency
          - subject to
        description: Subject-to indicator showing what the provision is contingent upon
        expr: SUBJECT_TO
        data_type: VARCHAR(3)
        access_modifier: public_access
      - name: SUBS_NUM
        synonyms:
          - sub number
          - subdivision number
        description: Subdivision number within the agreement
        expr: SUBS_NUM
        data_type: VARCHAR(3)
        access_modifier: public_access
      - name: VALUE1
        synonyms:
          - provision value
          - value
        description: Primary value field for the provision (e.g., percentage, dollar amount)
        expr: VALUE1
        data_type: VARCHAR(50)
        access_modifier: public_access
    time_dimensions:
      - name: EXT_EXPR_DATE
        synonyms:
          - extended expiration date
          - extension date
          - provision expiry
        description: Extended expiration date for the provision
        expr: EXT_EXPR_DATE
        data_type: DATE
        access_modifier: public_access
    primary_key:
      columns:
